[project]
name = "tebaki-engine"
version = "0.1.0"
description = "Tebaki — the city's guardian: Strands-powered civic complaint engine"
readme = {text = "Tebaki civic operations engine", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "h3>=4.0",
    "scikit-learn>=1.5",
    # The engine itself uses httpx for city-channel adapters.
    "httpx>=0.27,<0.28",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    # pytest-asyncio currently targets pytest 8's plugin API; keep the test
    # runner below pytest 9 until that compatibility line is released.
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    # Starlette 1.x TestClient prefers this compatibility transport.
    "httpx2>=2.12",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# Tests are synchronous (the app exposes sync orchestration handlers). Strict
# mode prevents pytest-asyncio from wrapping them in an event loop, which
# conflicts with Starlette TestClient's own blocking portal on Python 3.12+.
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "integration: requires an optional local service such as DynamoDB Local",
]
