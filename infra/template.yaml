AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tebaki browser-safe API proxy
Parameters:
  AgentRuntimeArn:
    Type: String
    Description: ARN of the deployed Tebaki AgentCore runtime
  WebOrigin:
    Type: String
    Default: '*'
    Description: CloudFront origin allowed by CORS
Resources:
  TebakiOperatorSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Tebaki operator token (generated; never stored in Git)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: token
        PasswordLength: 40
        ExcludePunctuation: true
  TebakiProxy:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: proxy_lambda.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 512
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          TEBAKI_AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          TEBAKI_OPERATOR_SECRET_ARN: !Ref TebakiOperatorSecret
          TEBAKI_WEB_ORIGIN: !Ref WebOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource: '*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TebakiOperatorSecret
Outputs:
  ApiUrl:
    Description: Public browser-safe API base URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  OperatorSecretArn:
    Description: Read this generated token from Secrets Manager for protected operator actions
    Value: !Ref TebakiOperatorSecret
