city:
  name: Addis Ababa
  local_name: አዲስ አበባ
  languages: [am, en]
  timezone: Africa/Addis_Ababa
  locale: am-ET
boundary:
  geojson: geojson/addis.geojson
  note: >-
    Published city-level administrative extent from the Ethiopian National
    Agri Data Hub (WGS84; dataset metadata updated 2025-09-03). Sub-city
    polygons remain a follow-up import; reports use the city fallback until
    that layer is locally vendored. Do not infer sub-city precision from this
    file until the official layer is vendored and validated.
admin:
  - level: city
    source: geojson
channels:
  email:
    - target: Addis Ababa City Communication Bureau (routing contact; sanitation handoff to verify)
      address: admin@addiscommunication.gov.et
      lang: am
  browser: null
  escalation:
    - level: sub-city
      target: Addis city routing desk (sub-city destination to be confirmed)
      email: admin@addiscommunication.gov.et
      after_days: 7
    - level: city
      target: Addis Ababa Mayor's Office
      email: info@aacmo.gov.et
      after_days: 14
    - level: federal
      target: Federal government eServices support / grievance routing
      email: contact@mint.gov.et
      after_days: 30
regulations:
  - cite: "Solid Waste Management Proclamation No. 513/2007 — https://leap.unep.org/en/countries/et/national-legislation/solid-waste-management-proclamation-no-513-2007"
    # Source-linked citation is used until the PDF is vendored locally.
    doc: null
coverage:
  status: city_fallback
  pilot_area: Arada (pilot label; boundary not yet vendored)
  boundary_source: "Ethiopian National Agri Data Hub, Addis Ababa City Woreda Boundary — https://data.moa.gov.et/dataset/addis-ababa-city-woreda-boundary1"
  boundary_verified_at: "2026-09-12"
  contact_source: "Addis Ababa City Communication Bureau — https://www.addiscommunication.gov.et/"
  contact_verified_at: "2026-09-12"
sla:
  acknowledge_days: 7
  resolve_days: 30
pitch:
  # JICA/AACMA 2022/23 waste-flow estimate; retained as a source-backed
  # context statistic, not a live service-level measurement.
  number: "2,647 tonnes of municipal solid waste generated per day (2022/23 estimate)"
  source: "JICA, Solid Waste Management Advisor for Addis Ababa City, Project Completion Report (2024), Fig. 2-11 — https://openjicareport.jica.go.jp/pdf/12384889.pdf"
