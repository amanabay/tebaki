<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tebaki-mark.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1408" />
    <meta
      name="description"
      content="Tebaki — the city's guardian. Reports civic issues once; the agent files, tracks, and escalates them."
    />
    <title>Tebaki ጠባቂ — The City's Guardian</title>
    <script>
      // apply saved theme before first paint to avoid a flash
      try {
        var t = localStorage.getItem("tebaki-theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
