[project]
name = "sandbox-portal"
version = "0.1.0"
description = "Tebaki sandbox: mock municipal complaint portal for offline dev/CI/evals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal"]
